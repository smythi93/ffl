[build-system]
requires = [
    "setuptools>=75.8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "feature-localization"
version = "0.0.1"
authors = [
    { name = "Marius Smytzek", email = "marius.smytzek@cispa.de" },
]
description = "Replication package: how do execution features improve statistical fault localization?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing"
]
dependencies = [
    # Rank.top_n must break ties only inside the group the cut-off falls into
    # (SFLKit branch fix/top-n-tie-breaking, released after 1.0.0).
    "sflkit >= 1.0.1",
    "sflkitlib >= 0.2.4",
    "tests4py >= 1.0.2",
    "numpy >= 2.0",
    "pandas >= 2.2.3",
    "scipy >= 1.11.0",
    "scikit-learn >= 1.6.1",
    "statsmodels >= 0.14",
    "matplotlib >= 3.8",
    "joblib >= 1.4.2",
    "unidiff >= 0.7.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=7.2.2",
    "pytest-cov>=4.1.0",
    "pytest-html>=3.2.0",
    "pytest-rerunfailures>=11.1.2",
]

[tool.black]
line-length = 88
target-version = ['py310']
